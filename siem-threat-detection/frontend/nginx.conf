server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container. The frontend code calls
    # relative paths like /api/v1/alerts, which only resolve correctly if
    # something in front of the static files forwards them — Vite's dev
    # server does this itself (see vite.config.ts), but the production
    # build is just static files, so nginx has to do it here.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback for everything else (client-side routing, direct
    # refreshes on a non-root path).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
