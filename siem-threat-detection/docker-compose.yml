services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./siem.db
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      SPLUNK_HEC_URL: https://splunk:8088
      SPLUNK_API_URL: https://splunk:8089
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-}
      SPLUNK_USERNAME: ${SPLUNK_USERNAME:-admin}
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:-changeme}
      SNORT_ALERT_LOG_PATH: /data/snort/log/alert
      AUTO_SYNC_ENABLED: ${AUTO_SYNC_ENABLED:-false}
      AUTO_CORRELATE_ENABLED: ${AUTO_CORRELATE_ENABLED:-false}
      ML_SCORE_ON_INGEST_ENABLED: ${ML_SCORE_ON_INGEST_ENABLED:-false}
    volumes:
      - backend_data:/app
      - snort_data:/data/snort
      - ./backend/models:/app/models
    depends_on:
      - splunk
      - snort
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  splunk:
    image: splunk/splunk:9.2
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:-changeme}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-}
    ports:
      - "8001:8000" # Splunk Web UI (host 8001 — backend already owns host 8000)
      - "8088:8088" # HEC
      - "8089:8089" # management/REST API
    volumes:
      - splunk_data:/opt/splunk/var
    restart: unless-stopped

  snort:
    build: ./snort
    environment:
      SNORT_MODE: ${SNORT_MODE:-pcap}
      SNORT_REPLAY_INTERVAL_SECONDS: ${SNORT_REPLAY_INTERVAL_SECONDS:-120}
    volumes:
      - snort_data:/data/snort
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

volumes:
  backend_data:
  snort_data:
  splunk_data:
