# Minimal Snort 2.9 config for the SIEM Threat Detection Platform lab.
# Deliberately pared down from the stock Ubuntu snort.conf — just the
# pieces needed to run alert_fast against local.rules, either live on an
# interface or offline against a pcap (-r).

# --- Network variables ---
ipvar HOME_NET any
ipvar EXTERNAL_NET any

# --- Paths ---
# In the Docker image these resolve to /etc/snort/{rules,so_rules,...} —
# the container's Dockerfile copies this directory's rules/ there to
# match. For local/offline testing (snort -c snort.conf -r some.pcap),
# run from inside this `snort/` directory so the relative fallback below
# resolves too; override with `snort ... --conf-error-out -S RULE_PATH=...`
# if running from elsewhere.
var RULE_PATH rules
var SO_RULE_PATH so_rules
var PREPROC_RULE_PATH preproc_rules

# --- Decoder / preprocessor (defaults are fine for this lab) ---
config checksum_mode: none
config disable_decode_alerts
config disable_tcpopt_experimental_alerts
config disable_tcpopt_obsolete_alerts
config disable_tcpopt_ttcp_alerts
config disable_tcpopt_alerts
config disable_ipopt_alerts

preprocessor frag3_global: max_frags 65536
preprocessor frag3_engine: policy windows detect_anomalies
preprocessor stream5_global: track_tcp yes, track_udp yes, track_icmp no
preprocessor stream5_tcp: policy windows, use_static_footprint_sizes
preprocessor stream5_udp: timeout 30

# --- Classification / reference metadata (ships with the `snort` apt
# package at this path — classtype: in local.rules resolves against it) ---
include /etc/snort/classification.config
include /etc/snort/reference.config

# --- Output: alert_fast, the only human/regex-parseable text format
# available in this Snort version (see backend/app/services/snort_service.py
# for why — there is no Snort 3 apt package on Ubuntu 24.04, and 2.9.20
# has no built-in JSON alert output). ---
output alert_fast: alert

# --- Rules ---
include $RULE_PATH/local.rules
